<style>
/* VOICE: centro de comando estratégico, sóbrio, tenso, informação densa e precisa

.stats{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:thin}
.st{flex:none;background:var(--pan);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-family:"Saira Condensed",sans-serif;line-height:1.15}

.mapbox{position:relative;height:clamp(280px,52vw,600px);border-radius:10px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 90% at 50% 40%,#13303d 0%,#0b1a22 70%,#081218 100%)}

body.gold{--bg:#14110a;--pan:#1e1a10;--pan2:#2a2414;--line:#4a3f22;--gold:#f2c14e}

const TSITE={US:[-116.05,37.1,'Nevada'],RU:[54.5,73.4,'Nova Zembla'],CN:[88.3,41.5,'Lop Nur'],FR:[-138.9,-21.8,'atol de Mururoa'],GB:[-157.4,1.9,'Ilha Christmas'],IN:[71.7,27.1,'Pokhran'],PK:[64.9,28.8,'montes Chagai'],KP:[129.1,41.3,'Punggye-ri'],IL:[35,30.6,'deserto do Negev'],BR:[-55,-9.3,'Serra do Cachimbo'],IR:[55.5,33,'deserto de Dasht-e Kavir'],AU:[131.6,-29.8,'Maralinga'],ZA:[20.3,-27.1,'deserto do Kalahari'],KZ:[78.1,50.1,'Semipalatinsk'],SA:[48,21,'deserto de Rub al-Khali'],EG:[28,25,'deserto Ocidental'],AR:[-68,-45,'planalto da Patagônia'],MX:[-104,28,'deserto de Chihuahua'],CA:[-105,63,'território do Norte'],TR:[38,38.5,'planalto da Anatólia'],JP:[140,25,'ilha remota no Pacífico'],KR:[129,37,'base no leste do país'],DE:[11,51.5,'área militar fechada'],UA:[33,47,'área militar fechada'],CL:[-69,-23,'deserto do Atacama'],VE:[-64,6,'Guayana'],CO:[-70,3,'Llanos'],ID:[120,-3,'ilha remota'],NG:[12,12,'norte do país'],VN:[107,13,'planalto central'],IT:[15,40.5,'área militar fechada'],ES:[-3,38,'área militar fechada'],PL:[22,50,'área militar fechada']};
function flyTo(lon,lat,k,ms,cb){const s={cx:V.cx,cy:V.cy,k:V.k},e={cx:lon,cy:MY(lat),k:Math.min(kMin()*18,k)},t0=performance.now();
 const f=now=>{const u=Math.min(1,(now-t0)/(RM?1:ms)),q=sm3(u);V.k=s.k+(e.k-s.k)*q;V.cx=s.cx+(e.cx-s.cx)*q;V.cy=s.cy+(e.cy-s.cy)*q;clampV();drawMap();if(!FX.run)draw(now);if(u<1)requestAnimationFrame(f);else cb&&cb()};requestAnimationFrame(f)}
function shake(){const m=$('#mapbox');if(RM)return;m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake')}
function seismo(mag){let p='',x=0;for(let i=0;i<=200;i++){x=i*1.6;const t=i/200,burst=t>.28?Math.exp(-(t-.28)*9)*(mag-3)*9:0,a=(1.2+burst)*(Math.random()*2-1)*(t>.28&&t<.31?2:1);p+=`${x.toFixed(1)},${(40+a).toFixed(1)} `}
 return`<svg viewBox="0 0 320 80" class="seis"><rect width="320" height="80" fill="#0b1216"/>${[20,40,60].map(y=>`<path d="M0 ${y}H320" stroke="#1d2a30"/>`).join('')}<polyline points="${p}" fill="none" stroke="#62e0a8" stroke-width="1.2" pathLength="1"/></svg>`}

 if(kind==='icbm'){const w=capL('tel')?'tel':capL('silo')?'silo':'sub',far=me.sea[0]>me.c[0]?1:-1,tgt=[cl(me.sea[0]+far*28,-175,175),cl(me.sea[1]-6,-55,70)];S.fired[w]+=w==='sub'?1/16:1;
  flyTo((me.c[0]+tgt[0])/2,(me.c[1]+tgt[1])/2,kMin()*2.2,1200,()=>volley([{from:myFrom(w,0),to:tgt,kind:w}],()=>{busy=false;S.deter=Math.min(100,(S.deter||0)+5);gb({mil:4,jov:-1});CO.forEach(o=>{if(o.id!==S.me&&(nbr(o.id,S.me)||isW(o)))rl(o.id,nbr(o.id,S.me)?-5:-2)});if(nptBound())S.susp=cl(S.susp+3,0,100);
   const km=Math.round(Math.hypot(tgt[0]-me.c[0],tgt[1]-me.c[1])*111/100)*100;log(`Teste de míssil balístico: o ICBM caiu no oceano a cerca de ${f0(km)} km do ponto de lançamento.`,'w');
   modal(`<h3>Teste de ICBM concluído</h3><p>O míssil voou cerca de <b>${f0(km)} km</b> e caiu no oceano dentro da área prevista.</p>${effTxt({mil:4,jov:-1})}<p class="dim">Vizinhos e potências ocidentais protestaram. A dissuasão do seu país aumentou.</p>`,[['Fechar','close','gold']]);render();save()}));return}
 const atm=kind==='atm';flyTo(ll[0],ll[1],kMin()*(atm?6:8),1500,()=>{const now=performance.now();
  if(atm){FX.bs.push({ll,ly:0,k:'nuc',b:now,l:9000,sc:1.9});FX.fl=.95;SND('xNuc');S.scars.push([ll[0],ll[1],1])}
  else{FX.bs.push({ll,ly:0,k:'ug',b:now,l:4200});SND('xNucFar');SND('xConv');for(let i=0;i<30;i++)puff(ll,0,{s:'dk',dx:rnd(-14,14),dy:rnd(-4,2),vx:rnd(-22,22),vy:rnd(-14,-2),l:rnd(2500,4500),r:rnd(2,4),g:3,a:.7})}
  shake();kick();setTimeout(()=>{busy=false;testResult(kind,st)},RM?200:atm?5200:3800)})}
function testResult(kind,st){const atm=kind==='atm',first=!S.tested&&C[S.me].nk===0;S.tested=(S.tested||0)+1;S.inv.wh--;S.lastTest={t:S.turn,atm,y:0,site:st[2]};
 const y=Math.round(atm?rnd(150,has('mirv')?3000:800):rnd(8,has('mirv')?250:120));S.lastTest.y=y;const mag=(4.45+.75*Math.log10(y)).toFixed(1);

 CO.forEach(o=>{if(o.id===S.me)return;let d=-6-(isW(o)?10:0)-(nbr(o.id,S.me)?10:0)-(atm?6:0);if(o.id==='KP')d=5;rl(o.id,d)});

 unTrig('cond',S.me);if(atm)S.soot=(S.soot||0)+1.5;S.deter=Math.min(100,(S.deter||0)+(first?40:12));S.org.auth.test=-1;
 const me=C[S.me];log(first?`${me.n} realizou seu primeiro teste nuclear (${f0(y)} kt, ${st[2]}) e entrou para o clube atômico.`:`Teste nuclear ${atm?'atmosférico':'subterrâneo'} (${st[2]}): ${f0(y)} kt, magnitude ${mag.replace('.',',')}.`,'w');

 const pts=()=>pick(CO).c;
 function spawn(now){const a=pts(),b=pts();if(a===b)return;const bal=Math.random()<.6,dur=bal?4200:2600,int=Math.random()<.45;
  const m={a,b,t0:now,dur,bal,lf:bal?.35:.12,int:int?rnd(.55,.8):null};MA.ms.push(m);
  if(int){const ui=m.int,ft=(bal?Math.pow(ui,1/1.35):ui)*dur,d=Math.min(ft-200,1600);MA.ic.push({m,ui,t0:now+ft-d,dur:d,site:[b[0]+rnd(-2,2),b[1]+rnd(-2,2)]})}

 const mp=(m,u)=>{const ll=[m.a[0]+(m.b[0]-m.a[0])*u,m.a[1]+(m.b[1]-m.a[1])*u],p=P2(...ll),A=P2(...m.a),B=P2(...m.b);return[p[0],p[1]-Math.hypot(B[0]-A[0],B[1]-A[1])*m.lf*Math.sin(Math.PI*u)]};

   if(!m.st){m.st=1;const s=P2(...m.a);for(let i=0;i<18;i++)pf(s[0],s[1],{vx:rnd(-26,26),vy:rnd(-10,3),l:rnd(2000,3500),r:rnd(2.5,4)})}
   pf(q[0],q[1],{l:m.bal?rnd(2400,3800):1600,r:m.bal?2:1.4,g:m.bal?5:3});x.globalCompositeOperation='lighter';x.globalAlpha=1;x.drawImage(SP.fi,q[0]-7,q[1]-7,14,14);x.globalCompositeOperation='source-over';
   if(u>=end){m.dead=1;if(m.int!=null){MA.bs.push({x:q[0],y:q[1],b:now,l:900,k:'i'})}else{const e=P2(...m.b);MA.bs.push({x:e[0],y:e[1],b:now,l:m.bal?3200:1500,k:m.bal?'n':'c'})}}}

  MA.js=MA.js.filter(j=>!j.dead);

  MA.bs=MA.bs.filter(b=>now-b.b<b.l);x.globalCompositeOperation='source-over';x.globalAlpha=1}
 requestAnimationFrame(frame)}

const b64e=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
async function vcode(code){const m=(code||'').replace(/\s/g,'').match(/^CS1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/);if(!m)return null;
 try{if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},await vkey(),b64d(m[2]),new TextEncoder().encode(m[1])))return null;return JSON.parse(new TextDecoder().decode(b64d(m[1])))}catch(e){return null}}
function accBackupObj(){return{id:ACC.id,med:ACC.med,inv:ACC.inv,perm:ACC.perm,codes:ACC.codes||[],box:ACC.box||{},promo:(ACC.used||[]).filter(u=>u.startsWith('P:')),lang:ACC.lang,diff:ACC.diff,mode:ACC.mode,t:Date.now()}}
function recCode(){const p=b64e(new TextEncoder().encode(JSON.stringify(accBackupObj())));return'CSR1.'+p+'.'+crc16(p)}
async function restoreObj(bk){if(!bk||typeof bk.id!=='string'||!/^CS[A-Z0-9]{6}$/.test(bk.id))return false;const allow={},add=(k,q)=>{if(k==='salva5'){allow.salva=(allow.salva||0)+5*q}else if(k!=='med'&&k!=='med50')allow[k]=(allow[k]||0)+q};
 const codes=[],used=[];for(const c of(bk.codes||[]).slice(0,500)){const pl=await vcode(c);if(pl&&(pl.p==='*'||pl.p===bk.id)){codes.push(c);used.push(pl.n);add(pl.i,pl.q||1);if(pl.i==='med'){}}}
 const box={};Object.entries(bk.box||{}).forEach(([k,v])=>{v=Math.max(0,Math.min(999,+v||0));box[k]=v;add(k,v)});
 const n={id:bk.id,med:Math.max(0,Math.min(3000,+bk.med||0)),inv:{},perm:{},used:[...used,...(bk.promo||[]).filter(u=>typeof u==='string'&&u.startsWith('P:'))],codes,box,lang:T[bk.lang]?bk.lang:ACC.lang,diff:DIFF[bk.diff]?bk.diff:ACC.diff,mode:MODES.includes(bk.mode)?bk.mode:ACC.mode};
 Object.entries(bk.inv||{}).forEach(([k,v])=>{const m=Math.min(Math.max(0,+v||0),allow[k]||0);if(m)n.inv[k]=m});Object.keys(bk.perm||{}).forEach(k=>{if(bk.perm[k]&&allow[k]>0)n.perm[k]=true});
 ACC=n;accSave();applyTheme();return true}
